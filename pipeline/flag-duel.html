/* Hochformat-Bühne 1080×1920, skaliert auf die Fensterhöhe */
:root {
  --bg: #070812;
  --fg: #f2f4fa;
  color-scheme: dark;
}
:root:not([data-theme="light"]) { --bg: #070812; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #070812; } }
:root[data-theme="dark"] { --bg: #070812; }

<script>/* Flag Duel – deterministische Simulation (Browser + Node) */
(function (root) {
  const CFG = {
    W: 1080, H: 1920,
    cx: 540, cy: 1130, R: 450,      // Arena
    r: 66,                           // Kugelradius
    speed: 620,                      // px/s, für beide gleich
    itemR: 38,
    lives: 5,
    intro: 2.2,                      // Sekunden vor dem Start
    spikeFirst: 1.0, spikeRespawn: [1.0, 2.0],
    shieldFirst: 5.0, shieldRespawn: [10.0, 14.0],
    overtimeAt: 45,                  // danach wird es schneller
    hitCooldown: 0.25,
    outro: 4.5
  };

  function mulberry(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function Duel(nCountries, seed, opts) {
    this.cfg = Object.assign({}, CFG, opts || {});
    this.rnd = mulberry(seed);
    const rnd = this.rnd, c = this.cfg;
    const a = Math.floor(rnd() * nCountries);
    let b = Math.floor(rnd() * (nCountries - 1)); if (b >= a) b++;
    // Wunsch-Duell: Länder fest vorgeben, Zufallsfolge bleibt identisch
    this.ids = (opts && opts.ids) ? opts.ids.slice(0, 2) : [a, b];
    this.t = 0;              // Gesamtzeit
    this.phase = 'intro';
    this.events = [];
    this.winner = null;
    this.endT = null;
    // Startpositionen links/rechts, Richtungen zufällig aber nicht frontal
    this.m = [0, 1].map(i => {
      const ang = (i === 0 ? Math.PI * 0.75 : -Math.PI * 0.25) + (rnd() - 0.5) * 1.2;
      return {
        id: this.ids[i],
        x: c.cx + (i === 0 ? -1 : 1) * c.R * 0.45, y: c.cy + (rnd() - 0.5) * 120,
        vx: Math.cos(ang) * c.speed, vy: Math.sin(ang) * c.speed,
        lives: c.lives, spikes: false, shield: false, cd: 0, flash: 0, rot: 0, wob: 0
      };
    });
    this.items = [];          // {type:'spike'|'shield', x, y, born}
    this.next = { spike: c.spikeFirst, shield: c.shieldFirst };
    this.stats = { hits: 0, blocks: 0, wall: 0 };
  }

  Duel.prototype.speedNow = function () {
    const c = this.cfg, gt = this.gameT();
    return gt > c.overtimeAt ? c.speed * (1 + 0.03 * (gt - c.overtimeAt)) : c.speed;
  };
  Duel.prototype.gameT = function () { return Math.max(0, this.t - this.cfg.intro); };

  Duel.prototype.spawn = function (type) {
    const c = this.cfg, rnd = this.rnd;
    for (let k = 0; k < 40; k++) {
      const ang = rnd() * Math.PI * 2, rad = Math.sqrt(rnd()) * (c.R - c.itemR - 40);
      const x = c.cx + Math.cos(ang) * rad, y = c.cy + Math.sin(ang) * rad;
      const free = this.m.every(m => Math.hypot(m.x - x, m.y - y) > c.r + c.itemR + 60) &&
        this.items.every(it => Math.hypot(it.x - x, it.y - y) > c.itemR * 3);
      if (free) { this.items.push({ type, x, y, born: this.t }); this.events.push({ t: this.t, type: 'spawn', item: type, x, y }); return; }
    }
    this.next[type] = this.gameT() + 0.5; // später erneut versuchen
  };

  Duel.prototype.step = function (dt) {
    const c = this.cfg;
    this.t += dt;
    for (const m of this.m) { m.flash = Math.max(0, m.flash - dt * 2.5); m.wob = Math.max(0, m.wob - dt * 3); }
    if (this.phase === 'intro') { if (this.t >= c.intro) { this.phase = 'fight'; this.events.push({ t: this.t, type: 'go' }); } return; }
    if (this.phase === 'end') return;

    const gt = this.gameT();
    // Items spawnen
    for (const type of ['spike', 'shield']) {
      if (this.next[type] !== null && gt >= this.next[type] && !this.items.some(i => i.type === type)) {
        this.next[type] = null; this.spawn(type);
      }
    }
    const v = this.speedNow();
    const sub = 4, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (const m of this.m) {
        m.cd = Math.max(0, m.cd - h);
        m.x += m.vx * h; m.y += m.vy * h;
        m.rot += (m.vx > 0 ? 1 : -1) * v * h / c.r * 0.6;
        // Wand
        const dx = m.x - c.cx, dy = m.y - c.cy, d = Math.hypot(dx, dy);
        if (d + c.r > c.R) {
          const nx = dx / d, ny = dy / d, dot = m.vx * nx + m.vy * ny;
          if (dot > 0) {
            m.vx -= 2 * dot * nx; m.vy -= 2 * dot * ny;
            // leichte Zufallsabweichung gegen Endlosschleifen
            const j = (this.rnd() - 0.5) * 0.16, cs = Math.cos(j), sn = Math.sin(j);
            const vx = m.vx * cs - m.vy * sn, vy = m.vx * sn + m.vy * cs; m.vx = vx; m.vy = vy;
            this.stats.wall++;
            this.events.push({ t: this.t, type: 'wall', who: this.m.indexOf(m), x: c.cx + nx * c.R, y: c.cy + ny * c.R });
          }
          m.x = c.cx + nx * (c.R - c.r); m.y = c.cy + ny * (c.R - c.r);
        }
      }
      // Kugel-Kugel
      const [A, B] = this.m;
      const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
      if (d < 2 * c.r && d > 0) {
        const nx = dx / d, ny = dy / d;
        const rel = (A.vx - B.vx) * nx + (A.vy - B.vy) * ny;
        const ov = 2 * c.r - d;
        A.x -= nx * ov / 2; A.y -= ny * ov / 2; B.x += nx * ov / 2; B.y += ny * ov / 2;
        if (rel > 0) {
          A.vx -= rel * nx; A.vy -= rel * ny; B.vx += rel * nx; B.vy += rel * ny;
          if (A.cd <= 0 && B.cd <= 0) this.clash(A, B, (A.x + B.x) / 2, (A.y + B.y) / 2);
        }
      }
      // Geschwindigkeit konstant halten
      for (const m of this.m) {
        const sp = Math.hypot(m.vx, m.vy) || 1;
        // nie zu steil horizontal/vertikal festfahren: minimale Querkomponente
        m.vx = m.vx / sp * v; m.vy = m.vy / sp * v;
      }
      // Items einsammeln
      for (const m of this.m) {
        for (let i = this.items.length - 1; i >= 0; i--) {
          const it = this.items[i];
          if (Math.hypot(m.x - it.x, m.y - it.y) > c.r + c.itemR * 0.8) continue;
          if (it.type === 'spike' && !m.spikes) {
            m.spikes = true; this.items.splice(i, 1);
            this.next.spike = this.gameT() + c.spikeRespawn[0] + this.rnd() * (c.spikeRespawn[1] - c.spikeRespawn[0]);
            this.events.push({ t: this.t, type: 'pickup', item: 'spike', who: this.m.indexOf(m), x: it.x, y: it.y });
          } else if (it.type === 'shield' && !m.shield) {
            m.shield = true; this.items.splice(i, 1);
            this.next.shield = this.gameT() + c.shieldRespawn[0] + this.rnd() * (c.shieldRespawn[1] - c.shieldRespawn[0]);
            this.events.push({ t: this.t, type: 'pickup', item: 'shield', who: this.m.indexOf(m), x: it.x, y: it.y });
          }
        }
      }
      if (this.phase === 'end') break;
    }
  };

  Duel.prototype.clash = function (A, B, x, y) {
    const c = this.cfg, pair = [[A, B], [B, A]];
    let any = false;
    const res = [];
    for (const [att, def] of pair) {
      if (!att.spikes) continue;
      any = true;
      if (def.shield) { def.shield = false; res.push(['block', att, def]); this.stats.blocks++; }
      else { def.lives--; def.flash = 1; def.wob = 1; res.push(['hit', att, def]); this.stats.hits++; }
    }
    for (const [, att] of res) att.spikes = false;
    A.cd = B.cd = c.hitCooldown;
    if (!any) { this.events.push({ t: this.t, type: 'bump', x, y }); return; }
    for (const [kind, att, def] of res) {
      this.events.push({ t: this.t, type: kind, att: this.m.indexOf(att), def: this.m.indexOf(def), lives: def.lives, x: def.x, y: def.y });
    }
    const dead = this.m.filter(m => m.lives <= 0);
    if (dead.length) {
      // gleichzeitiger K.o. (sehr selten): wer mehr Leben hatte, ist egal – Gleichstand löst der Zufall
      const loser = dead.length === 2 ? dead[this.rnd() < 0.5 ? 0 : 1] : dead[0];
      if (dead.length === 2) { const other = dead.find(d => d !== loser); other.lives = 1; }
      const winner = this.m.find(m => m !== loser);
      this.winner = this.m.indexOf(winner);
      this.phase = 'end'; this.endT = this.t;
      this.events.push({ t: this.t, type: 'ko', winner: this.winner, loser: this.m.indexOf(loser), x: loser.x, y: loser.y });
    }
  };

  Duel.prototype.done = function () { return this.phase === 'end' && this.t - this.endT >= this.cfg.outro; };

  root.FlagDuel = { Duel, CFG, mulberry };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
(function () {
  const S = window.FlagDuel, C = window.COUNTRIES;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = 1080, H = 1920, FPS = 30;
  const FD = '"BSD", Impact, sans-serif', FU = '"BSC", "Arial Narrow", sans-serif';
  const PCOL = ['#ff5a5f', '#3da5ff'];          // Spielerfarben links / rechts
  const SPIKE = '#ffb703', SHIELD = '#4cc9f0', HIT = '#ff2e4d';
  const params = new URLSearchParams(location.search);
  const RENDER = params.get('render') === '1';

  /* ---------- Flaggen als Kreise ---------- */
  const flagImg = C.map(c => { const i = new Image(); i.src = c.f; return i; });

  /* ---------- Zustand ---------- */
  let duel, evIdx, fx, trails, shownOvertime, seed, forcedIds = null;
  function init(s, ids) {
    seed = s >>> 0; forcedIds = ids || null;
    duel = new S.Duel(C.length, seed, forcedIds ? { ids: forcedIds } : undefined);
    evIdx = 0; fx = []; trails = [[], []]; shownOvertime = false;
  }

  /* ---------- deterministische Effekte ---------- */
  function addFx(e) {
    const r = S.mulberry(Math.floor(e.t * 1000) + fx.length * 977 + seed);
    const parts = (n, col, sp, life, size) => Array.from({ length: n }, () => {
      const a = r() * Math.PI * 2, v = sp * (0.4 + r());
      return { vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.3, col: typeof col === 'function' ? col(r) : col, life: life * (0.6 + r() * 0.6), size: size * (0.5 + r()) };
    });
    switch (e.type) {
      case 'wall': fx.push({ k: 'ring', t: e.t, x: e.x, y: e.y, col: 'rgba(255,255,255,.55)', r0: 6, r1: 40, life: 0.25, w: 4 }); break;
      case 'bump': fx.push({ k: 'ring', t: e.t, x: e.x, y: e.y, col: '#ffffff', r0: 10, r1: 90, life: 0.3, w: 6 }); break;
      case 'pickup': {
        const col = e.item === 'spike' ? SPIKE : SHIELD;
        fx.push({ k: 'ring', t: e.t, x: e.x, y: e.y, col, r0: 20, r1: 150, life: 0.45, w: 10 });
        fx.push({ k: 'parts', t: e.t, x: e.x, y: e.y, p: parts(16, col, 520, 0.6, 12) });
        fx.push({ k: 'label', t: e.t, who: e.who, text: e.item === 'spike' ? 'SPIKES!' : 'SHIELD!', col, life: 1.0 });
        break;
      }
      case 'hit':
        fx.push({ k: 'shake', t: e.t, amp: 22, life: 0.4 });
        fx.push({ k: 'flash', t: e.t, col: 'rgba(255,46,77,.22)', life: 0.25 });
        fx.push({ k: 'ring', t: e.t, x: e.x, y: e.y, col: HIT, r0: 30, r1: 240, life: 0.5, w: 14 });
        fx.push({ k: 'parts', t: e.t, x: e.x, y: e.y, p: parts(34, rr => rr() < 0.5 ? HIT : '#ffffff', 900, 0.8, 16) });
        fx.push({ k: 'pop', t: e.t, x: e.x, y: e.y - 110, text: '-1', col: HIT, life: 1.1 });
        fx.push({ k: 'heart', t: e.t, who: e.def, idx: e.lives, life: 0.9 });
        break;
      case 'block':
        fx.push({ k: 'shake', t: e.t, amp: 10, life: 0.25 });
        fx.push({ k: 'parts', t: e.t, x: e.x, y: e.y, p: parts(26, rr => rr() < 0.6 ? SHIELD : '#e8fbff', 800, 0.7, 14), shard: true });
        fx.push({ k: 'pop', t: e.t, x: e.x, y: e.y - 110, text: 'BLOCKED!', col: SHIELD, life: 1.1, small: true });
        break;
      case 'go': fx.push({ k: 'banner', t: e.t, text: 'FIGHT!', col: '#ffffff', life: 0.9 }); break;
      case 'overtime': fx.push({ k: 'banner', t: e.t, text: 'SPEED UP!', col: SPIKE, life: 1.2, small: true }); break;
      case 'ko':
        fx.push({ k: 'shake', t: e.t, amp: 36, life: 0.7 });
        fx.push({ k: 'flash', t: e.t, col: 'rgba(255,255,255,.55)', life: 0.35 });
        fx.push({ k: 'parts', t: e.t, x: e.x, y: e.y, p: parts(70, rr => [PCOL[e.loser], '#ffffff', HIT, SPIKE][Math.floor(rr() * 4)], 1300, 1.3, 20) });
        fx.push({ k: 'ring', t: e.t, x: e.x, y: e.y, col: '#ffffff', r0: 40, r1: 520, life: 0.7, w: 18 });
        break;
    }
  }

  function pumpEvents() {
    while (evIdx < duel.events.length) addFx(duel.events[evIdx++]);
    if (!shownOvertime && duel.phase === 'fight' && duel.gameT() >= duel.cfg.overtimeAt) {
      shownOvertime = true; const e = { t: duel.t, type: 'overtime' }; duel.events.push(e);
    }
  }

  /* ---------- Zeichenhilfen ---------- */
  const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const back = x => { x = Math.min(1, Math.max(0, x)); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  function text(s, x, y, size, col, opts = {}) {
    ctx.font = `${opts.w || 900} ${size}px ${opts.f || FD}`;
    ctx.textAlign = opts.align || 'center'; ctx.textBaseline = opts.base || 'middle';
    if (opts.max) { const w = ctx.measureText(s).width; if (w > opts.max) { size = Math.floor(size * opts.max / w); ctx.font = `${opts.w || 900} ${size}px ${opts.f || FD}`; } }
    if (opts.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = opts.stroke; ctx.strokeStyle = opts.strokeCol || 'rgba(0,0,0,.85)'; ctx.strokeText(s, x, y); }
    if (opts.glow) { ctx.shadowColor = opts.glow; ctx.shadowBlur = opts.glowB || 30; }
    ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.shadowBlur = 0;
  }
  function flagCircle(id, x, y, rad, rot = 0, grey = 0) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.clip();
    if (grey) ctx.filter = `grayscale(${grey}) brightness(${1 - grey * 0.45})`;
    ctx.drawImage(flagImg[id], -rad, -rad, rad * 2, rad * 2);
    ctx.filter = 'none';
    const g = ctx.createRadialGradient(-rad * 0.35, -rad * 0.4, rad * 0.1, 0, 0, rad);
    g.addColorStop(0, 'rgba(255,255,255,.35)'); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.fillStyle = g; ctx.fillRect(-rad, -rad, rad * 2, rad * 2);
    ctx.restore();
  }
  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x - s * 0.55, y - s * 0.05, x - s * 0.5, y - s * 0.6, x, y - s * 0.28);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 0.6, x + s * 0.55, y - s * 0.05, x, y + s * 0.35);
    ctx.closePath();
  }
  function star(x, y, n, r0, r1, rot) {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = rot + i * Math.PI / n, rr = i % 2 ? r0 : r1;
      i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function shieldShape(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.quadraticCurveTo(x + s * 0.95, y - s * 0.75, x + s * 0.85, y - s * 0.15);
    ctx.quadraticCurveTo(x + s * 0.7, y + s * 0.7, x, y + s);
    ctx.quadraticCurveTo(x - s * 0.7, y + s * 0.7, x - s * 0.85, y - s * 0.15);
    ctx.quadraticCurveTo(x - s * 0.95, y - s * 0.75, x, y - s);
    ctx.closePath();
  }

  /* ---------- Szene ---------- */
  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0d1024'); g.addColorStop(0.55, '#090b1a'); g.addColorStop(1, '#05060d');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // diagonale Streifen
    ctx.save(); ctx.globalAlpha = 0.04; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    const off = (t * 30) % 60;
    for (let x = -H; x < W + H; x += 60) { ctx.beginPath(); ctx.moveTo(x + off, 0); ctx.lineTo(x + off - H * 0.6, H); ctx.stroke(); }
    ctx.restore();
    // Farbschimmer der beiden Seiten
    for (const [i, x] of [[0, 0], [1, W]]) {
      const rg = ctx.createRadialGradient(x, 420, 10, x, 420, 620);
      rg.addColorStop(0, PCOL[i] + '33'); rg.addColorStop(1, PCOL[i] + '00');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    }
  }

  function drawHeader(t) {
    const intro = ease(t / 0.55);
    text('WHICH COUNTRY WINS?', W / 2, 250, 56, 'rgba(242,244,250,.92)', { w: 700, f: FD, glow: 'rgba(0,0,0,.6)', glowB: 12 });
    const cards = [290, 790];
    duel.m.forEach((m, i) => {
      const slide = (1 - intro) * (i === 0 ? -520 : 520);
      const x = cards[i] + slide, y = 410;
      const lost = duel.phase === 'end' && duel.winner !== i;
      const koAge = duel.endT !== null ? duel.t - duel.endT : 0;
      // Glow-Ring in Spielerfarbe
      ctx.save(); ctx.shadowColor = PCOL[i]; ctx.shadowBlur = 40;
      ctx.beginPath(); ctx.arc(x, y, 92, 0, Math.PI * 2); ctx.lineWidth = 10; ctx.strokeStyle = PCOL[i]; ctx.stroke(); ctx.restore();
      flagCircle(m.id, x, y, 86, 0, lost ? Math.min(1, koAge * 2) : 0);
      text(C[m.id].n.toUpperCase(), x, 548, 60, '#ffffff', { max: 380, stroke: 8 });
      // Herzen
      const n = duel.cfg.lives, sp = 54, x0 = x - (n - 1) * sp / 2;
      for (let k = 0; k < n; k++) {
        const hx = x0 + k * sp, hy = 625, alive = k < m.lives;
        let s = 44;
        const brk = fx.find(f => f.k === 'heart' && f.who === i && f.idx === k && t - f.t < f.life);
        if (brk) s *= 1 + 0.6 * Math.sin(Math.min(1, (t - brk.t) / 0.35) * Math.PI);
        heartPath(hx, hy, s);
        if (alive) { ctx.fillStyle = HIT; ctx.shadowColor = HIT; ctx.shadowBlur = 14; ctx.fill(); ctx.shadowBlur = 0; }
        else { ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.stroke(); }
      }
      // Status-Badges unter den Herzen
      const badges = [];
      if (m.spikes) badges.push(['SPIKES', SPIKE]);
      if (m.shield) badges.push(['SHIELD', SHIELD]);
      badges.forEach(([lab, col], k) => {
        const bx = x + (k - (badges.length - 1) / 2) * 150, by = 690;
        ctx.fillStyle = col + '26'; ctx.strokeStyle = col; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(bx - 66, by - 22, 132, 44, 22); ctx.fill(); ctx.stroke();
        text(lab, bx, by + 1, 28, col, { w: 700, f: FU });
      });
    });
    const vs = back((t - 0.25) / 0.45);
    ctx.save(); ctx.translate(W / 2, 410); ctx.scale(vs, vs);
    text('VS', 0, 0, 120, '#ffffff', { stroke: 12, glow: '#ffffff', glowB: 25 });
    ctx.restore();
  }

  function drawArena(t) {
    const c = duel.cfg, a = ease((t - 0.2) / 0.6);
    ctx.save(); ctx.globalAlpha = a;
    // Außenring mit Glow
    ctx.shadowColor = 'rgba(140,160,255,.55)'; ctx.shadowBlur = 50;
    ctx.beginPath(); ctx.arc(c.cx, c.cy, c.R + 8, 0, Math.PI * 2); ctx.lineWidth = 16; ctx.strokeStyle = '#2b3360'; ctx.stroke();
    ctx.shadowBlur = 0;
    const rg = ctx.createRadialGradient(c.cx, c.cy - 120, 40, c.cx, c.cy, c.R);
    rg.addColorStop(0, '#141a3a'); rg.addColorStop(1, '#090c1c');
    ctx.beginPath(); ctx.arc(c.cx, c.cy, c.R, 0, Math.PI * 2); ctx.fillStyle = rg; ctx.fill();
    // Innenlinien
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 3;
    for (const f of [0.33, 0.66]) { ctx.beginPath(); ctx.arc(c.cx, c.cy, c.R * f, 0, Math.PI * 2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(c.cx - c.R, c.cy); ctx.lineTo(c.cx + c.R, c.cy); ctx.stroke();
    // zweifarbiger Rand
    for (const i of [0, 1]) {
      ctx.beginPath(); ctx.arc(c.cx, c.cy, c.R + 8, Math.PI / 2 + i * Math.PI, Math.PI * 1.5 + i * Math.PI);
      ctx.lineWidth = 6; ctx.strokeStyle = PCOL[i]; ctx.globalAlpha = a * 0.85; ctx.stroke();
    }
    ctx.globalAlpha = a * 0.18;
    text('NATIONS MARBLE', c.cx, c.cy, 64, '#ffffff', { w: 900 });
    ctx.restore();
  }

  function drawItems(t) {
    for (const it of duel.items) {
      const age = t - it.born, s = back(age / 0.35), bob = Math.sin(t * 4 + it.x) * 5;
      const x = it.x, y = it.y + bob, R = duel.cfg.itemR;
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      // Puls-Ring
      const pr = (t * 1.3) % 1;
      ctx.beginPath(); ctx.arc(0, 0, R + pr * 40, 0, Math.PI * 2);
      ctx.strokeStyle = (it.type === 'spike' ? SPIKE : SHIELD); ctx.globalAlpha = 1 - pr; ctx.lineWidth = 4; ctx.stroke(); ctx.globalAlpha = 1;
      if (it.type === 'spike') {
        ctx.shadowColor = SPIKE; ctx.shadowBlur = 30;
        star(0, 0, 9, R * 0.55, R * 1.15, t * 2);
        const g = ctx.createRadialGradient(0, 0, 4, 0, 0, R * 1.2); g.addColorStop(0, '#fff3b0'); g.addColorStop(0.5, SPIKE); g.addColorStop(1, '#e85d04');
        ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      } else {
        ctx.shadowColor = SHIELD; ctx.shadowBlur = 30;
        shieldShape(0, 0, R * 1.05);
        const g = ctx.createLinearGradient(0, -R, 0, R); g.addColorStop(0, '#bff3ff'); g.addColorStop(1, '#1b8fc6');
        ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0; ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        shieldShape(0, 2, R * 0.5); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawMarbles(t) {
    const c = duel.cfg, r = c.r;
    duel.m.forEach((m, i) => {
      const dead = duel.phase === 'end' && duel.winner !== i;
      if (dead) return;
      // Spur
      const tr = trails[i];
      for (let k = 0; k < tr.length; k++) {
        const p = tr[k], f = k / tr.length;
        ctx.beginPath(); ctx.arc(p[0], p[1], r * (0.35 + 0.55 * f), 0, Math.PI * 2);
        ctx.fillStyle = PCOL[i]; ctx.globalAlpha = 0.12 * f; ctx.fill();
      }
      ctx.globalAlpha = 1;
      const wob = 1 + 0.18 * m.wob * Math.sin(m.wob * 20);
      ctx.save(); ctx.translate(m.x, m.y); ctx.scale(wob, 1 / wob);
      // Stacheln
      if (m.spikes) {
        ctx.save(); ctx.rotate(t * 3);
        ctx.shadowColor = SPIKE; ctx.shadowBlur = 25;
        star(0, 0, 12, r + 2, r + 30, 0);
        const g = ctx.createRadialGradient(0, 0, r, 0, 0, r + 30); g.addColorStop(0, '#d9dde8'); g.addColorStop(0.7, '#ffffff'); g.addColorStop(1, SPIKE);
        ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = '#7a1f00'; ctx.stroke();
        ctx.restore();
      }
      // Kugel
      ctx.shadowColor = PCOL[i]; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2); ctx.fillStyle = PCOL[i]; ctx.fill(); ctx.shadowBlur = 0;
      ctx.restore();
      ctx.save(); ctx.translate(m.x, m.y); ctx.scale(wob, 1 / wob);
      flagCircle(m.id, 0, 0, r - 2, m.rot);
      if (m.flash > 0) { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,46,77,${0.7 * m.flash})`; ctx.fill(); }
      // Schild
      if (m.shield) {
        const sr = r + 20, sh = 0.5 + 0.5 * Math.sin(t * 6);
        ctx.beginPath(); ctx.arc(0, 0, sr, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(76,201,240,.16)'; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = SHIELD; ctx.shadowColor = SHIELD; ctx.shadowBlur = 25; ctx.stroke(); ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(0, 0, sr - 8, -2.4 + t, -1.4 + t); ctx.lineWidth = 5; ctx.strokeStyle = `rgba(255,255,255,${0.4 + 0.5 * sh})`; ctx.stroke();
      }
      ctx.restore();
    });
  }

  function drawFx(t) {
    fx = fx.filter(f => t - f.t < (f.life || (f.k === 'parts' ? 1.6 : 1.2)) + 0.05);
    for (const f of fx) {
      const a = t - f.t;
      if (f.k === 'ring') {
        const p = Math.min(1, a / f.life);
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * ease(p), 0, Math.PI * 2);
        ctx.lineWidth = f.w * (1 - p); ctx.strokeStyle = f.col; ctx.globalAlpha = 1 - p; ctx.stroke(); ctx.globalAlpha = 1;
      } else if (f.k === 'parts') {
        for (const p of f.p) {
          if (a > p.life) continue;
          const k = a / p.life, x = f.x + p.vx * a, y = f.y + p.vy * a + 700 * a * a;
          ctx.globalAlpha = 1 - k; ctx.fillStyle = p.col;
          if (f.shard) { ctx.save(); ctx.translate(x, y); ctx.rotate(a * 9 + p.size); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
          else { ctx.beginPath(); ctx.arc(x, y, p.size * (1 - k * 0.6), 0, Math.PI * 2); ctx.fill(); }
        }
        ctx.globalAlpha = 1;
      } else if (f.k === 'pop') {
        const p = a / f.life, s = back(a / 0.25);
        ctx.save(); ctx.globalAlpha = 1 - Math.max(0, (p - 0.6) / 0.4); ctx.translate(f.x, f.y - 90 * ease(p)); ctx.scale(s, s);
        text(f.text, 0, 0, f.small ? 70 : 120, f.col, { stroke: 12, glow: f.col, glowB: 25 }); ctx.restore();
      } else if (f.k === 'label') {
        const m = duel.m[f.who], p = a / f.life;
        ctx.save(); ctx.globalAlpha = 1 - Math.max(0, (p - 0.6) / 0.4); ctx.translate(m.x, m.y - duel.cfg.r - 60 - 40 * ease(p));
        const s = back(a / 0.2); ctx.scale(s, s);
        text(f.text, 0, 0, 56, f.col, { stroke: 10 }); ctx.restore();
      } else if (f.k === 'banner') {
        const p = a / f.life, s = back(a / 0.25);
        ctx.save(); ctx.globalAlpha = 1 - Math.max(0, (p - 0.65) / 0.35);
        ctx.translate(duel.cfg.cx, duel.cfg.cy); ctx.scale(s, s); ctx.rotate(-0.06);
        text(f.text, 0, 0, f.small ? 130 : 190, f.col, { stroke: 16, glow: f.col, glowB: 40 }); ctx.restore();
      } else if (f.k === 'flash') {
        ctx.fillStyle = f.col; ctx.globalAlpha = 1 - a / f.life; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
      }
    }
  }

  function drawOutro(t) {
    if (duel.phase !== 'end') return;
    const a = t - duel.endT - 0.9; if (a < 0) return;
    const k = ease(a / 0.5), win = duel.m[duel.winner], wi = duel.winner;
    ctx.fillStyle = `rgba(5,6,13,${0.82 * k})`; ctx.fillRect(0, 0, W, H);
    const cy = 1060;
    // Strahlen
    ctx.save(); ctx.translate(W / 2, cy); ctx.rotate(t * 0.4); ctx.globalAlpha = 0.18 * k;
    for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60, -900); ctx.lineTo(60, -900); ctx.closePath(); ctx.fillStyle = i % 2 ? PCOL[wi] : '#ffffff'; ctx.fill(); }
    ctx.restore();
    const s = back(a / 0.5);
    ctx.save(); ctx.translate(W / 2, cy); ctx.scale(s, s);
    ctx.shadowColor = PCOL[wi]; ctx.shadowBlur = 60;
    ctx.beginPath(); ctx.arc(0, 0, 196, 0, Math.PI * 2); ctx.fillStyle = PCOL[wi]; ctx.fill(); ctx.shadowBlur = 0;
    flagCircle(win.id, 0, 0, 184, Math.sin(t * 2) * 0.08);
    // Krone
    ctx.translate(0, -250); ctx.beginPath();
    ctx.moveTo(-90, 40); ctx.lineTo(-110, -40); ctx.lineTo(-50, 0); ctx.lineTo(0, -60); ctx.lineTo(50, 0); ctx.lineTo(110, -40); ctx.lineTo(90, 40); ctx.closePath();
    ctx.fillStyle = SPIKE; ctx.shadowColor = SPIKE; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0; ctx.lineWidth = 5; ctx.strokeStyle = '#7a4a00'; ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = k;
    text(C[win.id].n.toUpperCase(), W / 2, cy + 290, 130, '#ffffff', { max: 900, stroke: 14, glow: PCOL[wi], glowB: 30 });
    text('WINS!', W / 2, cy + 410, 110, SPIKE, { stroke: 12 });
    text(`${win.lives} ${win.lives === 1 ? 'LIFE' : 'LIVES'} LEFT`, W / 2, cy + 500, 46, 'rgba(255,255,255,.8)', { w: 700, f: FU });
    ctx.globalAlpha = ease((a - 1.2) / 0.5);
    text('COMMENT THE NEXT DUEL: COUNTRY VS COUNTRY', W / 2, 520, 44, '#ffffff', { w: 700, f: FU, max: 960, stroke: 6 });
    ctx.globalAlpha = 1;
  }

  function draw() {
    const t = duel.t;
    let sx = 0, sy = 0;
    for (const f of fx) if (f.k === 'shake' && t - f.t < f.life) {
      const p = 1 - (t - f.t) / f.life, a = f.amp * p * p;
      sx += Math.sin((t - f.t) * 90 + f.amp) * a; sy += Math.cos((t - f.t) * 77) * a;
    }
    ctx.save(); ctx.translate(sx, sy);
    drawBackground(t);
    drawArena(t);
    drawItems(t);
    drawMarbles(t);
    drawHeader(t);
    drawFx(t);
    ctx.restore();
    drawOutro(t);
  }

  /* ---------- Zeitsteuerung ---------- */
  const SIM_DT = 1 / 60;
  function advance(seconds) {
    const n = Math.round(seconds / SIM_DT);
    for (let k = 0; k < n; k++) {
      duel.step(SIM_DT); pumpEvents();
      if (k % 2 === 1) duel.m.forEach((m, i) => { trails[i].push([m.x, m.y]); if (trails[i].length > 10) trails[i].shift(); });
    }
  }

  if (RENDER) {
    window.__init = (s, ids) => { init(s, ids); return document.fonts.ready.then(() => Promise.all(flagImg.map(i => i.decode()))).then(() => true); };
    window.__frame = (q) => { if (window.__f) advance(1 / FPS); window.__f = 1; draw(); return cv.toDataURL('image/jpeg', q || 0.9); };
    window.__state = () => ({ t: duel.t, phase: duel.phase, done: duel.done(), endT: duel.endT, winner: duel.winner, ids: duel.ids, names: duel.ids.map(i => C[i].n), lives: duel.m.map(m => m.lives), events: duel.events });
  } else {
    // Live-Modus: Endlosschleife mit zufälligen Duellen
    init(parseInt(params.get('seed') || '', 10) || Math.floor(Math.random() * 1e9));
    let last = performance.now(), acc = 0;
    const loop = now => {
      acc += Math.min(0.1, (now - last) / 1000); last = now;
      while (acc >= SIM_DT) { duel.step(SIM_DT); pumpEvents(); acc -= SIM_DT; if ((duel.t * 60 | 0) % 2) duel.m.forEach((m, i) => { trails[i].push([m.x, m.y]); if (trails[i].length > 10) trails[i].shift(); }); }
      draw();
      if (duel.done()) init(Math.floor(Math.random() * 1e9));
      requestAnimationFrame(loop);
    };
    document.fonts.ready.then(() => requestAnimationFrame(t => { last = t; loop(t); }));
  }
})();
</script>
